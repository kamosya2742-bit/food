<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Nutrition</title>
    <script>window.ENV = window.ENV || {};</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="smart-nutrition-simple.js"></script>
    <style>
        :root {
            --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
            --text:#e8eaf0; --text-2:#9ca3b0; --text-3:#6b7280;
            --accent:#6366f1; --accent-h:#818cf8; --accent-bg:rgba(99,102,241,.12);
            --green:#22c55e; --green-bg:rgba(34,197,94,.12);
            --yellow:#f59e0b; --yellow-bg:rgba(245,158,11,.12);
            --red:#ef4444; --red-bg:rgba(239,68,68,.12);
            --blue:#38bdf8; --blue-bg:rgba(56,189,248,.12);
            --r:12px; --r-sm:8px;
        }
        [data-theme="light"] {
            --bg:#f1f3f9; --surface:#ffffff; --surface2:#eef0f8; --border:#d1d5e8;
            --text:#111827; --text-2:#374151; --text-3:#6b7280;
            --accent:#4f46e5; --accent-h:#6366f1; --accent-bg:rgba(79,70,229,.1);
            --green:#16a34a; --green-bg:rgba(22,163,74,.1);
            --yellow:#d97706; --yellow-bg:rgba(217,119,6,.1);
            --red:#dc2626; --red-bg:rgba(220,38,38,.1);
            --blue:#0284c7; --blue-bg:rgba(2,132,199,.1);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem}
        .card-inner{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:.75rem 1rem}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.875rem;font-weight:600;border:none;cursor:pointer;border-radius:var(--r-sm);padding:.6rem 1.1rem;transition:opacity .15s,transform .15s,box-shadow .15s}
        .btn:active{transform:scale(.97)} .btn:disabled{opacity:.5;cursor:not-allowed}
        .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:var(--accent-h);box-shadow:0 0 0 3px var(--accent-bg)}
        .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)} .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
        .btn-full{width:100%}
        .field{display:flex;flex-direction:column;gap:5px}
        .field label{font-size:.75rem;font-weight:600;color:var(--text-2);letter-spacing:.04em;text-transform:uppercase}
        input,select,textarea{font-family:inherit;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:var(--r-sm);padding:.65rem .9rem;font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
        input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
        select option{background:var(--surface);color:var(--text)}
        .app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:.8rem 1.1rem;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between}
        .app-logo{font-size:1.05rem;font-weight:700;color:var(--accent);letter-spacing:-.01em}
        .app-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;position:sticky;top:57px;z-index:30}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:.55rem .25rem;background:none;border:none;cursor:pointer;color:var(--text-3);font-size:.68rem;font-weight:500;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
        .nav-btn svg{width:18px;height:18px} .nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
        .prog-track{background:var(--surface2);border-radius:99px;height:8px;overflow:hidden}
        .prog-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .6s cubic-bezier(.4,0,.2,1)}
        .prog-fill.over{background:linear-gradient(90deg,var(--red),var(--yellow))}
        .macro-row{display:flex;gap:.65rem}
        .macro-pill{flex:1;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:.6rem .4rem}
        .macro-val{font-size:1.1rem;font-weight:700} .macro-lbl{font-size:.65rem;color:var(--text-3);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
        .meal-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:.7rem .9rem;transition:border-color .2s}
        .meal-row:hover{border-color:var(--accent)}
        .meal-del{opacity:0;background:none;border:none;cursor:pointer;color:var(--red);padding:3px;border-radius:5px;transition:opacity .2s}
        .meal-row:hover .meal-del{opacity:1}
        .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem}
        .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:2rem 1.75rem;width:100%;max-width:400px;animation:fadeUp .3s ease}
        .auth-icon{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 1.1rem}
        .auth-icon svg{width:24px;height:24px;color:#fff}
        .auth-tabs{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;margin-bottom:1.25rem}
        .auth-tab{flex:1;padding:.45rem;background:none;border:none;cursor:pointer;font-size:.875rem;font-weight:600;color:var(--text-3);border-radius:6px;transition:all .2s}
        .auth-tab.active{background:var(--accent);color:#fff}
        .lang-switcher{display:flex;gap:4px}
        .lang-btn{padding:.3rem .55rem;border-radius:6px;background:none;border:1.5px solid var(--border);color:var(--text-3);font-size:.75rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.03em}
        .lang-btn:hover{border-color:var(--accent);color:var(--accent)} .lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
        .lang-card-row{display:flex;gap:8px}
        .lang-card-btn{flex:1;padding:.65rem;border-radius:var(--r-sm);background:var(--surface2);border:1.5px solid var(--border);color:var(--text-3);font-size:.85rem;font-weight:700;cursor:pointer;text-align:center;transition:all .2s}
        .lang-card-btn:hover{border-color:var(--accent);color:var(--accent)} .lang-card-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-h)}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:1.25rem;animation:fadeIn .2s ease}
        .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;width:100%;max-width:420px;animation:fadeUp .25s ease}
        #toastContainer{position:fixed;top:1rem;right:1rem;z-index:100;display:flex;flex-direction:column;gap:6px}
        .toast{padding:.6rem 1rem;border-radius:var(--r-sm);font-size:.875rem;font-weight:500;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:slideIn .3s ease}
        .toast-success{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
        .toast-error{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}
        .toast-info{background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent-h)}
        .upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:2rem 1rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
        .upload-zone:hover{border-color:var(--accent);background:var(--accent-bg)}
        .upload-zone svg{width:36px;height:36px;color:var(--text-3);margin:0 auto .6rem;display:block}
        .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-3)}
        .empty-state svg{width:40px;height:40px;margin:0 auto .75rem;display:block;opacity:.4}
        .section-title{font-size:1.35rem;font-weight:700;letter-spacing:-.015em}
        .badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface2);color:var(--text-3);border:1px solid var(--border)}
        .space-y>*+*{margin-top:.85rem} .space-y-sm>*+*{margin-top:.5rem}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.65rem}
        .flex-between{display:flex;align-items:center;justify-content:space-between}
        .flex-center{display:flex;align-items:center;gap:.5rem}
        .c-green{color:var(--green)} .c-yellow{color:var(--yellow)} .c-red{color:var(--red)}
        .c-blue{color:var(--blue)} .c-accent{color:var(--accent-h)} .c-2{color:var(--text-2)} .c-3{color:var(--text-3)}
        /* Day nav */
        .day-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:.5rem .75rem;margin-bottom:.75rem}
        .day-nav-btn{background:none;border:none;cursor:pointer;color:var(--text-3);padding:.25rem .5rem;border-radius:6px;font-size:1rem;transition:color .2s}
        .day-nav-btn:hover{color:var(--accent)} .day-nav-btn:disabled{opacity:.3;cursor:default}
        .day-nav-label{font-size:.85rem;font-weight:600;color:var(--text);text-align:center;flex:1}
        /* Cal history row */
        .cal-history-row{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--border);cursor:pointer;transition:color .2s}
        .cal-history-row:last-child{border-bottom:none}
        .cal-history-row:hover .cal-day-label{color:var(--accent)}
        .cal-day-label{font-size:.85rem;font-weight:600;min-width:90px}
        .cal-bar-wrap{flex:1;background:var(--surface2);border-radius:99px;height:6px;overflow:hidden}
        .cal-bar{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
        .cal-kcal{font-size:.8rem;color:var(--text-3);min-width:55px;text-align:right}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        main{padding:1rem;padding-bottom:5rem;max-width:600px;margin:0 auto}
    </style>
</head>
<body data-theme="dark">

<div id="toastContainer"></div>

<!-- AUTH -->
<div id="authScreen" class="auth-wrap">
    <div class="auth-card">
        <div class="auth-icon"><i data-lucide="leaf"></i></div>
        <h2 style="text-align:center;font-size:1.25rem;font-weight:700;margin-bottom:.25rem;">Smart Nutrition</h2>
        <p id="authSubtitle" style="text-align:center;font-size:.85rem;color:var(--text-3);margin-bottom:1rem;"></p>
        <div style="display:flex;justify-content:center;margin-bottom:1.25rem;">
            <div class="lang-switcher">
                <button class="lang-btn" onclick="setLang('ru')">RU</button>
                <button class="lang-btn" onclick="setLang('kz')">KZ</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" id="loginBtn" onclick="switchAuthMode('login')"></button>
            <button class="auth-tab" id="registerBtn" onclick="switchAuthMode('register')"></button>
        </div>
        <form id="authForm" class="space-y">
            <div class="field"><label id="lbl_email"></label><input type="email" id="email" required placeholder="you@example.com"></div>
            <div class="field"><label id="lbl_password"></label><input type="password" id="password" required placeholder="••••••••"></div>
            <div id="registerFields" class="space-y" style="display:none;">
                <div class="field"><label id="lbl_name"></label><input type="text" id="name" id="inp_name"></div>
                <div class="grid-2">
                    <div class="field"><label id="lbl_gender"></label>
                        <select id="gender"><option value="male" id="opt_male"></option><option value="female" id="opt_female"></option></select>
                    </div>
                    <div class="field"><label id="lbl_birth"></label><input type="date" id="birthDate"></div>
                </div>
                <div class="grid-2">
                    <div class="field"><label id="lbl_height"></label><input type="number" id="height" min="100" max="250" placeholder="175"></div>
                    <div class="field"><label id="lbl_weight_reg"></label><input type="number" id="weight" min="30" max="300" placeholder="70"></div>
                </div>
                <div class="field"><label id="lbl_calgoal"></label><input type="number" id="calorieGoal" min="800" max="5000" value="2000"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem;"><span id="submitBtnText"></span></button>
        </form>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none;">
    <header class="app-header">
        <span class="app-logo">Smart Nutrition</span>
        <div class="flex-center">
            <div class="lang-switcher">
                <button class="lang-btn" onclick="setLang('ru')">RU</button>
                <button class="lang-btn" onclick="setLang('kz')">KZ</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
            </div>
            <span id="userNameDisplay" style="font-size:.8rem;color:var(--text-3);margin-left:.25rem;"></span>
            <button onclick="logout()" class="btn btn-ghost" style="padding:.4rem .6rem;">
                <i data-lucide="log-out" style="width:15px;height:15px;"></i>
            </button>
        </div>
    </header>
    <nav class="app-nav">
        <button class="nav-btn" data-tab="home" onclick="showTab('home')">
            <i data-lucide="home"></i><span data-i18n="nav_home"></span>
        </button>
        <button class="nav-btn" data-tab="add" onclick="showTab('add')">
            <i data-lucide="plus-circle"></i><span data-i18n="nav_add"></span>
        </button>
        <button class="nav-btn" data-tab="plan" onclick="showTab('plan')">
            <i data-lucide="calendar"></i><span data-i18n="nav_plan"></span>
        </button>
        <button class="nav-btn" data-tab="profile" onclick="showTab('profile')">
            <i data-lucide="user"></i><span data-i18n="nav_profile"></span>
        </button>
    </nav>
    <main id="mainContent"></main>
</div>

<script>
window.showToast = (msg, type = 'info') => {
    const c = document.getElementById('toastContainer');
    if (!c) return;
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.cssText += ';opacity:0;transform:translateX(110%);transition:all .35s'; setTimeout(() => el.remove(), 360); }, 3200);
};

function t(key) { return window.i18n?.t(key) || key; }

function applyI18n() {
    const lang = window.i18n?.getLang() || 'ru';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('.lang-btn,.lang-card-btn').forEach(btn => {
        const bl = btn.getAttribute('onclick')?.match(/'(\w+)'/)?.[1];
        btn.classList.toggle('active', bl === lang);
    });
    const s = document.getElementById('authSubtitle'); if (s) s.textContent = t('welcome');
    const lb = document.getElementById('loginBtn'); if (lb) lb.textContent = t('login');
    const rb = document.getElementById('registerBtn'); if (rb) rb.textContent = t('register');
    const el = (id) => document.getElementById(id);
    if (el('lbl_email')) el('lbl_email').textContent = t('email');
    if (el('lbl_password')) el('lbl_password').textContent = t('password');
    if (el('lbl_name')) el('lbl_name').textContent = t('name');
    if (el('lbl_gender')) el('lbl_gender').textContent = t('gender');
    if (el('lbl_birth')) el('lbl_birth').textContent = t('birth_date');
    if (el('lbl_height')) el('lbl_height').textContent = t('height_cm');
    if (el('lbl_weight_reg')) el('lbl_weight_reg').textContent = t('weight_kg');
    if (el('lbl_calgoal')) el('lbl_calgoal').textContent = t('calorie_goal');
    if (el('inp_name')) el('inp_name').placeholder = t('your_name');
    if (el('opt_male')) el('opt_male').textContent = t('male');
    if (el('opt_female')) el('opt_female').textContent = t('female');
    if (el('submitBtnText')) el('submitBtnText').textContent = authMode === 'login' ? t('sign_in') : t('sign_up');
}

function setLang(lang) {
    window.i18n.setLang(lang);
    applyI18n();
    if (document.getElementById('mainApp').style.display !== 'none') showTab(currentTab);
}

let currentTab = 'home';
let authMode = 'login';
// State for day navigation
let homeViewDate = new Date().toISOString().split('T')[0];
let planViewDate = new Date().toISOString().split('T')[0];

function dateOffset(base, days) {
    const d = new Date(base); d.setDate(d.getDate() + days);
    return d.toISOString().split('T')[0];
}
function isToday(date) { return date === new Date().toISOString().split('T')[0]; }
function formatDateLabel(date, lang) {
    const locales = { ru: 'ru-RU', kz: 'kk-KZ', en: 'en-US' };
    const d = new Date(date + 'T12:00:00');
    if (isToday(date)) {
        return d.toLocaleDateString(locales[lang]||'ru-RU', { weekday:'long', day:'numeric', month:'long' });
    }
    return d.toLocaleDateString(locales[lang]||'ru-RU', { weekday:'short', day:'numeric', month:'short' });
}

document.addEventListener('DOMContentLoaded', async () => {
    lucide.createIcons();
    applyI18n();
    const has = window.simpleState.checkLocalSession();
    if (has) {
        // FIX: Показываем приложение с локальными данными сразу,
        // а когда env загрузится — данные обновятся автоматически через _onDataReady
        showMainApp();
        window._onDataReady = () => { showTab(currentTab); };
        // Также грузим данные сразу если supabase уже доступен
        if (window.simpleState.supabase) {
            await Promise.allSettled([
                window.simpleState.loadMedicalInfo(),
                window.simpleState.loadMeals(),
                window.simpleState.loadMealPlans(),
                window.simpleState.loadWeightProgress()
            ]);
            showTab(currentTab);
        }
    } else {
        showAuthScreen();
    }
});

function switchAuthMode(mode) {
    authMode = mode;
    const isLogin = mode === 'login';
    document.getElementById('loginBtn').classList.toggle('active', isLogin);
    document.getElementById('registerBtn').classList.toggle('active', !isLogin);
    const rf = document.getElementById('registerFields');
    rf.style.display = isLogin ? 'none' : 'flex';
    rf.style.flexDirection = isLogin ? '' : 'column';
    document.getElementById('submitBtnText').textContent = isLogin ? t('sign_in') : t('sign_up');
}

function showAuthScreen() {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    applyI18n();
    requestAnimationFrame(() => lucide.createIcons());
}

function showMainApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('userNameDisplay').textContent = window.simpleState.userData?.name || '';
    homeViewDate = new Date().toISOString().split('T')[0];
    planViewDate = new Date().toISOString().split('T')[0];
    showTab('home');
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.querySelector('#authForm button[type="submit"]');
    const span = document.getElementById('submitBtnText');
    btn.disabled = true; span.textContent = '…';
    try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        let result;
        if (authMode === 'login') {
            result = await window.simpleState.login(email, password);
        } else {
            result = await window.simpleState.register({
                email, password,
                name: document.getElementById('name').value.trim(),
                gender: document.getElementById('gender').value,
                birthDate: document.getElementById('birthDate').value,
                height: parseFloat(document.getElementById('height').value) || null,
                weight: parseFloat(document.getElementById('weight').value) || null,
                calorieGoal: parseInt(document.getElementById('calorieGoal').value) || 2000
            });
        }
        if (result.success) { showToast(authMode === 'login' ? t('welcome_back') : t('registered'), 'success'); showMainApp(); }
        else showToast(result.error || 'Ошибка', 'error');
    } catch (err) { showToast('Ошибка: ' + err.message, 'error'); }
    finally { btn.disabled = false; span.textContent = authMode === 'login' ? t('sign_in') : t('sign_up'); }
});

function showTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const c = document.getElementById('mainContent');
    c.innerHTML = '';
    c.style.animation = 'none';
    requestAnimationFrame(() => { c.style.animation = 'fadeUp .25s ease'; });
    ({ home: showHome, add: showAddMeal, plan: showMealPlan, profile: showProfile }[tab])(c);
    requestAnimationFrame(() => lucide.createIcons());
}

// ── HOME (с листанием дней) ────────────────────────────────────
function showHome(c) {
    const lang = window.i18n.getLang();
    const stats = window.simpleState.getStatsForDate(homeViewDate);
    const meals = window.simpleState.getMealsForDate(homeViewDate);
    const user = window.simpleState.userData;
    const goal = user?.daily_calorie_goal || 2000;
    const pct = Math.min((stats.calories / goal) * 100, 100).toFixed(1);
    const over = stats.calories > goal;
    const trend = window.simpleState.getWeightTrend();
    const isTodayView = isToday(homeViewDate);
    const dateLabel = formatDateLabel(homeViewDate, lang);

    let trendHtml = '';
    if (trend && isTodayView) {
        const tl = trend.trend === 'down' ? t('weight_down') : trend.trend === 'up' ? t('weight_up') : t('weight_stable');
        const tc = trend.trend === 'down' ? 'var(--green)' : trend.trend === 'up' ? 'var(--red)' : 'var(--text-3)';
        trendHtml = `<p style="font-size:.8rem;margin-top:5px;color:${tc};">${tl}: ${trend.change>0?'+':''}${trend.change.toFixed(1)} кг ${t('days7')}</p>`;
    }

    // 7-day calorie history for the mini chart
    const historyRows = [];
    const maxCal = goal * 1.2;
    for (let i = 6; i >= 0; i--) {
        const d = dateOffset(new Date().toISOString().split('T')[0], -i);
        const s = window.simpleState.getStatsForDate(d);
        if (s.calories > 0 || isToday(d)) {
            const dayLabel = new Date(d + 'T12:00:00').toLocaleDateString(
                {ru:'ru-RU',kz:'kk-KZ',en:'en-US'}[lang]||'ru-RU', { weekday:'short', day:'numeric' }
            );
            const barPct = Math.min((s.calories / maxCal) * 100, 100).toFixed(0);
            const barColor = s.calories > goal ? 'var(--red)' : s.calories > goal*0.85 ? 'var(--green)' : 'var(--accent)';
            historyRows.push(`
            <div class="cal-history-row" onclick="homeGoToDate('${d}')">
                <span class="cal-day-label" style="${d===homeViewDate?'color:var(--accent-h);':''}">${dayLabel}${isToday(d)?' ★':''}</span>
                <div class="cal-bar-wrap"><div class="cal-bar" style="width:${barPct}%;background:${barColor};"></div></div>
                <span class="cal-kcal">${s.calories>0?Math.round(s.calories)+'':'-'}</span>
            </div>`);
        }
    }

    c.innerHTML = `
    <div class="space-y">
        <div class="card">
            <div class="flex-between" style="margin-bottom:.5rem;">
                <div>
                    <h2 style="font-size:1.3rem;font-weight:700;">${t('greeting')}, ${user?.name || '👋'}!</h2>
                    ${trendHtml}
                </div>
                <div style="text-align:right;">
                    <div style="font-size:1.75rem;font-weight:700;color:${over?'var(--red)':'var(--accent-h)'};">${Math.round(stats.calories)}</div>
                    <div style="font-size:.7rem;color:var(--text-3);">${t('of_kcal')} ${goal} ${t('kcal')}</div>
                </div>
            </div>
            <!-- Day navigation -->
            <div class="day-nav">
                <button class="day-nav-btn" onclick="homeNavigateDay(-1)">‹</button>
                <span class="day-nav-label" style="font-size:.8rem;">${dateLabel}</span>
                <button class="day-nav-btn" onclick="homeNavigateDay(1)" ${isTodayView?'disabled':''}>›</button>
            </div>
        </div>

        <div class="card">
            <div class="flex-between" style="margin-bottom:.65rem;">
                <span style="font-size:.9rem;font-weight:600;">${t('daily_progress')}</span>
                <span style="font-size:.8rem;color:${over?'var(--red)':'var(--green)};">
                    ${over ? `+${Math.round(stats.calories-goal)} ${t('over_kcal')}` : `${Math.round(goal-stats.calories)} ${t('left_kcal')}`}
                </span>
            </div>
            <div class="prog-track"><div class="prog-fill ${over?'over':''}" style="width:${pct}%"></div></div>
            <div class="macro-row" style="margin-top:.85rem;">
                <div class="macro-pill"><div class="macro-val c-green">${Math.round(stats.protein)}г</div><div class="macro-lbl">${t('protein')}</div></div>
                <div class="macro-pill"><div class="macro-val c-yellow">${Math.round(stats.fat)}г</div><div class="macro-lbl">${t('fat')}</div></div>
                <div class="macro-pill"><div class="macro-val c-blue">${Math.round(stats.carbs)}г</div><div class="macro-lbl">${t('carbs')}</div></div>
            </div>
        </div>

        ${meals.length > 0 ? `
        <div class="card">
            <div class="flex-between" style="margin-bottom:.85rem;">
                <span style="font-size:.9rem;font-weight:600;">${isTodayView ? t('today') : formatDateLabel(homeViewDate, lang)}</span>
                <span class="badge">${meals.length} ${t('records')}</span>
            </div>
            <div class="space-y-sm">
                ${meals.map(m => `
                <div class="meal-row">
                    <div>
                        <div style="font-size:.9rem;font-weight:500;">${m.name}</div>
                        <div style="font-size:.775rem;color:var(--text-3);margin-top:2px;">${Math.round(m.calories)} ${t('kcal')} · <span class="badge">${m.category||'—'}</span></div>
                    </div>
                    <button class="meal-del" onclick="deleteMealAndRefresh('${m.id}')">
                        <i data-lucide="x" style="width:14px;height:14px;"></i>
                    </button>
                </div>`).join('')}
            </div>
        </div>` : `
        <div class="card empty-state">
            <i data-lucide="utensils"></i>
            <p style="margin-bottom:.85rem;font-weight:500;">${t('no_meals')}</p>
            ${isTodayView ? `<button class="btn btn-primary" onclick="goToAddForDate('${homeViewDate}')">${t('add_meal_btn')}</button>` : ''}
        </div>`}

        ${historyRows.length > 0 ? `
        <div class="card">
            <div style="font-size:.85rem;font-weight:600;color:var(--text-2);margin-bottom:.75rem;">7 ${t('days_tracked')}</div>
            ${historyRows.join('')}
        </div>` : ''}
    </div>`;
}

function homeNavigateDay(dir) {
    const today = new Date().toISOString().split('T')[0];
    const next = dateOffset(homeViewDate, dir);
    if (next > today) return;
    homeViewDate = next;
    showTab('home');
}

function homeGoToDate(date) {
    homeViewDate = date;
    showTab('home');
}

function goToAddForDate(date) {
    homeViewDate = date;
    showTab('add');
}

async function deleteMealAndRefresh(id) {
    await window.deleteMeal(id);
    showTab('home');
}

// ── ADD MEAL ───────────────────────────────────────────────────
function showAddMeal(c) {
    const addDate = homeViewDate; // добавляем на выбранную дату
    const isTodayView = isToday(addDate);
    const lang = window.i18n.getLang();
    const dateLbl = isTodayView ? '' : ` (${formatDateLabel(addDate, lang)})`;

    c.innerHTML = `
    <div class="space-y">
        <div class="card">
            <h2 class="section-title" style="margin-bottom:1rem;">${t('new_meal')}${dateLbl}</h2>
            <form id="mealForm" class="space-y">
                <div class="field"><label>${t('meal_name')}</label><input type="text" id="mealName" required placeholder="${t('meal_placeholder')}"></div>
                <div class="field"><label>${t('category')}</label>
                    <select id="mealCategory">
                        <option value="breakfast">${t('breakfast')}</option>
                        <option value="lunch">${t('lunch')}</option>
                        <option value="dinner">${t('dinner')}</option>
                        <option value="snack">${t('snack')}</option>
                    </select>
                </div>
                <div class="grid-2">
                    <div class="field"><label>${t('calories')}</label><input type="number" id="mealCalories" required min="0" placeholder="0" oninput="updateCaloriePreview()"></div>
                    <div class="field"><label>${t('weight')}</label><input type="number" id="mealWeight" min="0" placeholder="0"></div>
                </div>
                <div id="caloriePreview" style="display:none;padding:.65rem .9rem;background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--r-sm);font-size:.85rem;text-align:center;">
                    ${t('after_add')} <strong id="previewTotal"></strong> / <span id="previewGoal" class="c-3"></span> ${t('kcal')}
                </div>
                <div class="grid-3">
                    <div class="field"><label>${t('protein')}</label><input type="number" id="mealProtein" required min="0" step="0.1" placeholder="0"></div>
                    <div class="field"><label>${t('fat')}</label><input type="number" id="mealFat" required min="0" step="0.1" placeholder="0"></div>
                    <div class="field"><label>${t('carbs')}</label><input type="number" id="mealCarbs" required min="0" step="0.1" placeholder="0"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <i data-lucide="plus" style="width:15px;height:15px;"></i>
                    <span id="submitMealText">${t('add_meal_submit')}</span>
                </button>
            </form>
        </div>
        <div class="card">
            <h3 style="font-size:.95rem;font-weight:600;margin-bottom:.85rem;"><span class="c-accent">AI</span> ${t('ai_photo')}</h3>
            <div class="upload-zone" onclick="document.getElementById('imageInput').click()">
                <i data-lucide="camera"></i>
                <p style="font-weight:500;margin-bottom:4px;">${t('photo_hint')}</p>
                <p style="font-size:.8rem;color:var(--text-3);">${t('photo_sub')}</p>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none;">
            <div id="aiPreview" style="display:none;margin-top:.75rem;"></div>
        </div>
    </div>`;

    document.getElementById('mealForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.querySelector('#mealForm button[type="submit"]');
        const span = document.getElementById('submitMealText');
        btn.disabled = true; span.textContent = t('adding');
        const mealData = {
            name: document.getElementById('mealName').value.trim(),
            category: document.getElementById('mealCategory').value,
            calories: parseFloat(document.getElementById('mealCalories').value) || 0,
            weight: parseFloat(document.getElementById('mealWeight').value) || null,
            protein: parseFloat(document.getElementById('mealProtein').value) || 0,
            fat: parseFloat(document.getElementById('mealFat').value) || 0,
            carbs: parseFloat(document.getElementById('mealCarbs').value) || 0,
            meal_date: addDate,
            meal_time: new Date().toTimeString().substring(0, 5),
            source: 'manual'
        };
        const r = await window.addMeal(mealData);
        if (r.success) { showTab('home'); }
        else { btn.disabled = false; span.textContent = t('add_meal_submit'); }
    });

    document.getElementById('imageInput').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const prev = document.getElementById('aiPreview');
        prev.style.display = 'block';
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const dataUrl = ev.target.result;
            const base64 = dataUrl.split(',')[1];
            prev.innerHTML = `
                <div style="position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:.75rem;">
                    <img src="${dataUrl}" alt="food" style="width:100%;max-height:220px;object-fit:cover;display:block;border-radius:var(--r);">
                    <div id="imgOverlay" style="position:absolute;inset:0;background:rgba(15,17,23,.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);">
                        <div style="text-align:center;color:#fff;">
                            <div style="font-size:1.5rem;margin-bottom:6px;animation:spin 1.2s linear infinite;display:inline-block;">⚙️</div>
                            <div style="font-size:.8rem;font-weight:600;">${t('analyzing')}</div>
                        </div>
                    </div>
                </div>
                <div id="aiStatus"></div>`;
            try {
                const result = await window.simpleAI.analyzeImage(base64, window.simpleState.medicalInfo);
                document.getElementById('imgOverlay')?.remove();
                const status = document.getElementById('aiStatus');
                if (result.error) {
                    if (status) status.innerHTML = `<div style="padding:.65rem .9rem;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r-sm);font-size:.85rem;color:var(--red);">❌ ${result.error}</div>`;
                    return;
                }
                document.getElementById('mealName').value = result.name || '';
                document.getElementById('mealCalories').value = result.calories || 0;
                document.getElementById('mealWeight').value = result.weight || '';
                document.getElementById('mealProtein').value = result.protein || 0;
                document.getElementById('mealFat').value = result.fat || 0;
                document.getElementById('mealCarbs').value = result.carbs || 0;
                if (result.category) document.getElementById('mealCategory').value = result.category;
                updateCaloriePreview();
                if (status) status.innerHTML = `<div style="padding:.65rem .9rem;background:var(--green-bg);border:1px solid var(--green);border-radius:var(--r-sm);font-size:.85rem;color:var(--green);">
                    ${t('recognized')} <strong>${result.name}</strong> — ${result.calories} ${t('kcal')}
                    ${result.warnings?.length ? `<div style="margin-top:5px;color:var(--yellow);">⚠️ ${result.warnings.join('. ')}</div>` : ''}
                </div>`;
                showToast(t('photo_filled'), 'success');
            } catch (err) {
                document.getElementById('imgOverlay')?.remove();
                const status = document.getElementById('aiStatus');
                if (status) status.innerHTML = `<div style="padding:.65rem .9rem;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r-sm);font-size:.85rem;color:var(--red);">❌ ${err.message}</div>`;
            }
        };
        reader.readAsDataURL(file);
    });
}

function updateCaloriePreview() {
    const cal = parseFloat(document.getElementById('mealCalories')?.value) || 0;
    const prev = document.getElementById('caloriePreview');
    if (!prev) return;
    if (!cal) { prev.style.display = 'none'; return; }
    const cur = window.simpleState.getStatsForDate(homeViewDate).calories;
    const goal = window.simpleState.userData?.daily_calorie_goal || 2000;
    const tot = cur + cal;
    prev.style.display = 'block';
    const span = document.getElementById('previewTotal');
    span.textContent = Math.round(tot);
    span.style.color = tot > goal ? 'var(--red)' : 'var(--accent-h)';
    document.getElementById('previewGoal').textContent = goal;
}

// ── PLAN (с листанием дней + история что ел) ──────────────────
function showMealPlan(c) {
    const lang = window.i18n.getLang();
    const plan = window.simpleState.getMealPlanForDate(planViewDate);

            </button>` : ''}

        <div style="display:flex;gap:.35rem;">${calDays.join('')}</div>

        <div class="card">
            <div class="day-nav" style="margin-bottom:1rem;">

            ${plan ? `

                    <div style="font-size:1.7rem;font-weight:700;color:var(--accent-h);">${Math.round(plan.total_calories)}</div>
                    <div style="font-size:.7rem;color:var(--text-3);margin-bottom:.65rem;text-transform:uppercase;letter-spacing:.04em;">${t('total_kcal')}</div>
                    <div class="macro-row">

            <div class="empty-state">

        <div class="card" style="background:var(--accent-bg);border-color:var(--accent);">

            <div class="grid-2">
                <div style="text-align:center;">
                    <div style="font-size:1.4rem;font-weight:700;color:var(--accent-h);">${avgCal}</div>
                    <div style="font-size:.7rem;color:var(--text-3);">${t('avg_calories')}</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:1.4rem;font-weight:700;color:var(--accent-h);">${trackedDays}</div>
                    <div style="font-size:.7rem;color:var(--text-3);">${t('days_tracked')}</div>
                </div>
            </div>
        </div>` : ''}

        <div class="card">
            <div style="font-size:.9rem;font-weight:600;margin-bottom:.85rem;">${t('personal_data')}</div>
            <div class="grid-2" style="margin-bottom:.65rem;">
                <div class="field"><label>${t('weight_kg')}</label><input type="number" id="profileWeight" value="${user?.weight||''}"></div>
                <div class="field"><label>${t('calorie_goal')}</label><input type="number" id="profileCalories" value="${user?.daily_calorie_goal||2000}"></div>
            </div>
            <p style="font-size:.75rem;color:var(--text-3);margin-bottom:.65rem;">${t('weight_note')}</p>
            <button class="btn btn-primary btn-full" onclick="updateProfile()">${t('save_changes')}</button>

            <div class="flex-between" style="margin-bottom:.85rem;">
                <div style="font-size:.9rem;font-weight:600;">${t('medical_data')}</div>
                <button class="btn btn-ghost" onclick="showAddMedicalForm()" style="padding:.35rem .75rem;font-size:.8rem;">
                    <i data-lucide="plus" style="width:13px;height:13px;"></i> ${t('add_medical')}
                </button>
            </div>
            <div class="space-y-sm">
                ${med.length > 0 ? med.map(info => `
                <div class="card-inner flex-between">
                    <div>
                        <div style="font-size:.875rem;font-weight:500;">${info.name}</div>
                        <div style="font-size:.75rem;color:var(--text-3);margin-top:2px;"><span class="badge">${info.info_type}</span> <span class="badge">${info.severity}</span></div>
                    </div>
                    <button onclick="deleteMedicalInfo('${info.id}')" class="btn" style="background:var(--red-bg);color:var(--red);padding:.35rem .55rem;">
                        <i data-lucide="trash-2" style="width:13px;height:13px;"></i>
                    </button>
                </div>`).join('') : `<p style="font-size:.875rem;color:var(--text-3);">${t('no_medical')}</p>`}
            </div>
        </div>

        <div class="card">
            <div style="font-size:.9rem;font-weight:600;margin-bottom:.85rem;">${t('settings')}</div>
            <div class="flex-between" style="margin-bottom:.85rem;">
                <span style="font-size:.875rem;">${t('theme')}</span>
                <select onchange="changeTheme(this.value)" style="width:auto;">
                    <option value="dark" ${window.simpleState.currentTheme==='dark'?'selected':''}>${t('theme_dark')}</option>
                    <option value="light" ${window.simpleState.currentTheme==='light'?'selected':''}>${t('theme_light')}</option>
                </select>
            </div>
            <div>
                <div style="font-size:.875rem;margin-bottom:.65rem;">${t('language')}</div>
                <div class="lang-card-row">
                    <button class="lang-card-btn ${lang==='ru'?'active':''}" onclick="setLang('ru')">🇷🇺 RU</button>
                    <button class="lang-card-btn ${lang==='kz'?'active':''}" onclick="setLang('kz')">🇰🇿 KZ</button>
                    <button class="lang-card-btn ${lang==='en'?'active':''}" onclick="setLang('en')">🇬🇧 EN</button>
                </div>
            </div>
        </div>
    </div>`;
}

// ── GENERATE PLAN ──────────────────────────────────────────────
async function generateNewPlan() {
    const btn = document.getElementById('genBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '…'; }
    showToast(t('generating'), 'info');
    try {
        const user = window.simpleState.userData;
        const med = window.simpleState.medicalInfo;
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 3);
        const prevData = window.simpleState.meals
            .filter(m => new Date(m.meal_date) >= cutoff)
            .reduce((acc, m) => {
                const ex = acc.find(d => d.date === m.meal_date);
                if (ex) ex.calories += m.calories || 0;
                else acc.push({ date: m.meal_date, calories: m.calories || 0 });
                return acc;
            }, []);
        const plan = await window.simpleAI.generateMealPlan(user, med, prevData);
        if (!plan || plan.error) { showToast(plan?.error || t('plan_error'), 'error'); return; }
        const planData = {
            plan_date: planViewDate,
            breakfast_name: plan.breakfast?.name||'', breakfast_calories: plan.breakfast?.calories||0,
            breakfast_protein: plan.breakfast?.protein||0, breakfast_fat: plan.breakfast?.fat||0, breakfast_carbs: plan.breakfast?.carbs||0,
            lunch_name: plan.lunch?.name||'', lunch_calories: plan.lunch?.calories||0,
            lunch_protein: plan.lunch?.protein||0, lunch_fat: plan.lunch?.fat||0, lunch_carbs: plan.lunch?.carbs||0,
            dinner_name: plan.dinner?.name||'', dinner_calories: plan.dinner?.calories||0,
            dinner_protein: plan.dinner?.protein||0, dinner_fat: plan.dinner?.fat||0, dinner_carbs: plan.dinner?.carbs||0,
            snack_name: plan.snack?.name||'', snack_calories: plan.snack?.calories||0,
            snack_protein: plan.snack?.protein||0, snack_fat: plan.snack?.fat||0, snack_carbs: plan.snack?.carbs||0,
            total_calories: plan.total_calories||0, total_protein: plan.total_protein||0,
            total_fat: plan.total_fat||0, total_carbs: plan.total_carbs||0,
            ai_recommendations: Array.isArray(plan.recommendations) ? plan.recommendations.join('\n') : (plan.recommendations||'')
        };
        const r = await window.saveMealPlan(planData);
        if (r.success) { showToast(t('plan_generated'), 'success'); showTab('plan'); }
        else showToast(r.error || t('plan_error'), 'error');
    } catch (err) {
        console.error('generateNewPlan:', err);
        showToast('Ошибка: ' + err.message, 'error');
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="sparkles" style="width:14px;height:14px;"></i> ${t('generate')}`;
            requestAnimationFrame(() => lucide.createIcons());
        }
    }
}

async function updateProfile() {
    const newWeight = parseFloat(document.getElementById('profileWeight').value) || null;
    const calories = parseInt(document.getElementById('profileCalories').value) || 2000;
    const oldWeight = window.simpleState.userData?.weight;

    const r = await window.updateUserData({ weight: newWeight, daily_calorie_goal: calories });
    if (r.success && newWeight) {
        await window.addWeightProgress({
            weight: newWeight, measured_date: new Date().toISOString().split('T')[0], note: 'Обновлён в профиле'
        });

        // FIX: Поздравление если похудел за неделю
        if (oldWeight && newWeight < oldWeight) {
            const diff = (oldWeight - newWeight).toFixed(1);
            showToast(`${t('congrats_loss')} ${diff} ${t('kg')}! 🎉`, 'success');
        }
    }
    if (r.success) showTab('profile');
}

function showAddMedicalForm() {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay'; modal.id = 'medModal';
    modal.innerHTML = `
    <div class="modal-card">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem;">${t('add_med_title')}</h3>
        <form id="medicalForm" class="space-y">
            <div class="field"><label>${t('med_name')}</label><input type="text" id="medicalName" required placeholder="${t('med_name_placeholder')}"></div>
            <div class="grid-2">
                <div class="field"><label>${t('med_type')}</label>
                    <select id="medicalType">
                        <option value="disease">${t('disease')}</option>
                        <option value="allergy">${t('allergy')}</option>
                        <option value="intolerance">${t('intolerance')}</option>
                    </select>
                </div>
                <div class="field"><label>${t('severity')}</label>
                    <select id="medicalSeverity">
                        <option value="mild">${t('mild')}</option>
                        <option value="moderate">${t('moderate')}</option>
                        <option value="severe">${t('severe')}</option>
                    </select>
                </div>
            </div>
            <div class="field"><label>${t('description')}</label><textarea id="medicalDescription" rows="2" placeholder="${t('desc_placeholder')}"></textarea></div>
            <div class="grid-2" style="margin-top:.25rem;">
                <button type="submit" class="btn btn-primary">${t('add_btn')}</button>
                <button type="button" onclick="closeMedicalModal()" class="btn btn-ghost">${t('cancel')}</button>
            </div>
        </form>
    </div>`;
    document.body.appendChild(modal);
    requestAnimationFrame(() => lucide.createIcons());
    document.getElementById('medicalForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const r = await window.addMedicalInfo({
            name: document.getElementById('medicalName').value.trim(),
            info_type: document.getElementById('medicalType').value,
            severity: document.getElementById('medicalSeverity').value,
            description: document.getElementById('medicalDescription').value.trim()
        });
        if (r.success) { closeMedicalModal(); showTab('profile'); }
    });
}

function closeMedicalModal() { document.getElementById('medModal')?.remove(); }

async function deleteMedicalInfo(id) {
    if (!confirm(t('confirm_delete'))) return;
    const r = await window.simpleState.deleteMedicalInfo(id);
    if (r.success) { showToast(t('med_deleted'), 'success'); showTab('profile'); }
}

function changeTheme(th) { window.simpleState.updateTheme(th); }

async function logout() {
    if (!confirm(t('confirm_logout'))) return;
    await window.simpleState.logout();
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    showAuthScreen();
}

Object.assign(window, {
    showTab, switchAuthMode, setLang, generateNewPlan, updateProfile,
    showAddMedicalForm, closeMedicalModal, deleteMedicalInfo,
    changeTheme, logout, updateCaloriePreview, deleteMealAndRefresh,
    homeNavigateDay, homeGoToDate, goToAddForDate,
    planNavigateDay, planGoToDate
});
</script>
